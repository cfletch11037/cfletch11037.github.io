<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
</head>
<body>
    <h1>Big Text (Header)</h1>
    <p>This is smaller text (a paragraph).</p>
    <div>
    <img src="testimage.jpg" alt="a photo of a small dog; a black lab, pitbull mix.">
    </div>
    <div>
    <img src="orangecatinacardboardbox.png" alt="an orange cat peeking out of a cardboard box" width="100" height="900">
    </div>
    <button type="button" id="upButton">Click for +1</button>
    <button type="button" id="downButton">Click for -1</button>
    <div class="counter">Clicks: <span id=numClicks>0</span></div>
    <script src="buttons.js"></script>
    <div>
    <p>Rate the animals:</p>
    <input type="range" id="love" name="rating" min="0" max="100" value="50">
    <p>Rating: <span id="ratingDisplay">50</span></p>
    </div>
    <script src="slider.js"></script>
</body>
</html>

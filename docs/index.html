<!DOCTYPE html>
<html>
<head>
    <title>cfletch11037</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Big Text (Header)</h1>
    <hr>
    <p>This is smaller text (a paragraph). Under and above this are horizontal lines.</p>
    <hr>
    <div>
    <img src="testimage.jpg" alt="a photo of a small dog; a black lab, pitbull mix.">
    </div>
    <div>
    <img src="orangecatinacardboardbox.png" alt="an orange cat peeking out of a cardboard box" width="100" height="900">

    <button type="button" id="downButton">-1</button>

    <script src="rating.js"></script>
    </div>
